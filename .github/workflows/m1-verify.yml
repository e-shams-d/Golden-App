# GitHub Actions adapter for the provider-neutral CI contract
# (infra/ci/README.md). Pending owner approval before it becomes a required
# check. Open governance decisions, marked TODO below where they bite:
#   - waiver process for an intentional OpenAPI breaking change
#   - artifact retention policy and evidence storage location
#   - container registry and digest-promotion workflow
name: m1-verify

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: m1-verify-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.8.22"
  PNPM_VERSION: "11.15.1"
  TRIVY_VERSION: "0.72.0"
  SYFT_VERSION: "1.49.0"
  OASDIFF_VERSION: "1.26.1"

jobs:
  secret-scan:
    name: Repository secret scan (gate 4)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # On a pull request the scanner lists the PR's commits through the API, so
    # it needs read access to pull requests. Granted here rather than at the
    # workflow level so no other job gets the extra scope.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks (maintained scanner, full history)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  native:
    name: Native verification (gates 1-2)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # Persistence work needs a real PostgreSQL: extensions, privileges, and
    # constraint enforcement either do not exist in SQLite or behave differently
    # there, so a green SQLite run would be evidence of nothing. Redis joins it
    # per the approved M2 decision, ahead of the queue and idempotency work that
    # needs it, so the shape of this job stops changing every slice.
    services:
      postgres:
        image: postgres:16.14-alpine3.24
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7.4.9-alpine3.21
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # The integration tests create and drop a database per test, so this is a
      # superuser-capable identity. It exists only inside this ephemeral job.
      INTEGRATION_ADMIN_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Enable corepack pnpm
        run: |
          corepack enable
          corepack prepare "pnpm@${PNPM_VERSION}" --activate
          pnpm --version
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Install pinned uv
        uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
      - name: Frozen frontend graph + Playwright Chromium (per CI contract)
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @gold/trader-pwa exec playwright install --with-deps chromium
      # The manifest is the checksum chain behind every M0 citation, and a
      # governance document can change without it. Checked in its own step, not
      # inside the native verifier, because that script is part of the accepted
      # M1 acceptance evidence and is not being altered here.
      - name: M0 governance manifest hashes match their files
        run: python3 infra/scripts/m0_manifest.py
      # Fail here rather than forty minutes into the verifier, and keep Redis
      # from becoming infrastructure nothing ever looks at. Deliberately a bare
      # TCP check: redis-cli is not guaranteed on the runner image, and a gate
      # that depends on an unpinned preinstalled tool fails for the wrong
      # reason. Each container already runs its own client-side health command.
      - name: Backing services are reachable
        shell: bash
        run: |
          for service in postgres:5432 redis:6379; do
            port=${service##*:}
            if ! timeout 5 bash -c "cat < /dev/null > /dev/tcp/127.0.0.1/${port}"; then
              echo "${service%%:*} is not accepting connections on ${port}" >&2
              exit 1
            fi
            echo "${service%%:*} reachable on ${port}"
          done
      - name: Native verifier (exact-version, frozen, full gates)
        run: sh infra/scripts/verify-native.sh
      - name: Reject post-run drift (lockfiles, OpenAPI, generated types)
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)"
      - name: Record toolchain versions
        if: always()
        run: |
          {
            echo "source_commit=${GITHUB_SHA}"
            echo "node=$(node --version)"
            echo "pnpm=$(pnpm --version)"
            echo "uv=$(uv --version)"
            echo "python=$(uv run --project services/backend --frozen python --version)"
          } | tee toolchain-versions.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-evidence
          path: toolchain-versions.txt

  openapi-compat:
    name: OpenAPI merge-base compatibility (gate 3)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install pinned oasdiff
        run: |
          archive="oasdiff_${OASDIFF_VERSION}_linux_amd64.tar.gz"
          base="https://github.com/oasdiff/oasdiff/releases/download/v${OASDIFF_VERSION}"
          curl -sSfL -o "${RUNNER_TEMP}/${archive}" "${base}/${archive}"
          curl -sSfL -o "${RUNNER_TEMP}/checksums.txt" "${base}/checksums.txt"
          expected=$(awk -v f="${archive}" '$2 == f { print; exit }' "${RUNNER_TEMP}/checksums.txt")
          if [ -z "${expected}" ]; then
            echo "No published checksum for ${archive}" >&2
            exit 1
          fi
          (cd "${RUNNER_TEMP}" && printf '%s\n' "${expected}" | sha256sum -c -)
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}" oasdiff
          "${RUNNER_TEMP}/oasdiff" --version
          echo "${RUNNER_TEMP}" >> "${GITHUB_PATH}"
      - name: Extract merge-base contract
        run: |
          git fetch origin "${{ github.base_ref }}"
          merge_base=$(git merge-base "origin/${{ github.base_ref }}" HEAD)
          echo "merge base: ${merge_base}"
          git show "${merge_base}:services/backend/openapi/v1.json" \
            > "${RUNNER_TEMP}/openapi-base.json"
      # TODO(governance): agree the waiver mechanism for an intentional
      # breaking change (contract-version bump plus recorded approval).
      - name: Breaking-change detection
        run: |
          oasdiff breaking --fail-on ERR \
            "${RUNNER_TEMP}/openapi-base.json" \
            services/backend/openapi/v1.json

  docker-acceptance:
    name: Docker acceptance + scans + SBOM (gates 5-8)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    needs: [native]
    steps:
      - uses: actions/checkout@v4
      - name: Generate ephemeral CI-only .env (never committed, masked charset)
        run: |
          python3 - <<'EOF'
          import secrets, string, pathlib
          alphabet = string.ascii_letters + string.digits + "._~-"
          first = string.ascii_letters + string.digits
          def gen(n):
              return secrets.choice(first) + "".join(secrets.choice(alphabet) for _ in range(n - 1))
          template = pathlib.Path(".env.example").read_text(encoding="utf-8")
          import os, re
          values = {
              "RELEASE_COMMIT": os.environ["GITHUB_SHA"],
              "POSTGRES_PASSWORD": gen(24),
              "APP_DB_PASSWORD": gen(24),
              "MIGRATION_DB_PASSWORD": gen(24),
              "REDIS_PASSWORD": gen(24),
              "OPERATIONS_HEALTH_TOKEN": gen(48),
          }
          out = []
          for line in template.splitlines():
              key = line.split("=", 1)[0].strip() if "=" in line else None
              if key in values:
                  out.append(f"{key}={values[key]}")
              else:
                  out.append(line)
          pathlib.Path(".env").write_text("\n".join(out) + "\n", encoding="utf-8")
          EOF
      - name: Docker acceptance verifier
        run: sh infra/scripts/verify-docker.sh
      # The verifier never prints container logs, so a failure here otherwise
      # says only that a container was unhealthy and the cause has to be
      # reproduced locally. On failure it writes them to .local/diagnostics with
      # every known credential redacted; upload that so the reason is visible
      # from the run itself.
      - name: Capture stack diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: docker-stack-diagnostics
          path: .verify-diagnostics/
          if-no-files-found: warn
          retention-days: 7
      # Scanners run as runner-local pinned binaries. The repository forbids
      # handing any container access to the host Docker daemon socket, which a
      # containerized scanner would require to read locally built images.
      - name: Install pinned scanners
        run: |
          install_release() {
            base=$1 archive=$2 checksums=$3 binary=$4
            curl -sSfL -o "${RUNNER_TEMP}/${archive}" "${base}/${archive}"
            curl -sSfL -o "${RUNNER_TEMP}/${checksums}" "${base}/${checksums}"
            expected=$(awk -v f="${archive}" '$2 == f { print; exit }' "${RUNNER_TEMP}/${checksums}")
            if [ -z "${expected}" ]; then
              echo "No published checksum for ${archive}" >&2
              exit 1
            fi
            (cd "${RUNNER_TEMP}" && printf '%s\n' "${expected}" | sha256sum -c -)
            tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}/scanners" "${binary}"
          }
          mkdir -p "${RUNNER_TEMP}/scanners"
          install_release \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}" \
            "trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" \
            "trivy_${TRIVY_VERSION}_checksums.txt" \
            trivy
          install_release \
            "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}" \
            "syft_${SYFT_VERSION}_linux_amd64.tar.gz" \
            "syft_${SYFT_VERSION}_checksums.txt" \
            syft
          # GITHUB_PATH only affects later steps, so smoke-test by full path.
          "${RUNNER_TEMP}/scanners/trivy" --version
          "${RUNNER_TEMP}/scanners/syft" --version
          echo "${RUNNER_TEMP}/scanners" >> "${GITHUB_PATH}"
      # Each scan writes JSON evidence, then converts it to a table so the log
      # states what a red gate found instead of failing silently. Secrets are
      # covered by the dedicated gitleaks job, so scan for vulnerabilities only.
      - name: Dependency vulnerability scan (gate 6)
        run: |
          trivy fs --severity HIGH,CRITICAL --scanners vuln \
            --ignorefile .trivyignore.yaml --show-suppressed \
            --format json --output trivy-deps.json .
          trivy convert --format table --exit-code 1 --show-suppressed trivy-deps.json
      # Two passes per image. The first records every finding for the evidence
      # artifact. The second decides the gate and covers only findings with a
      # published fix: base-OS advisories the distribution has marked deferred
      # or won't-fix cannot be acted on by rebuilding, and gating on them would
      # leave the pipeline permanently red while saying nothing new. The count
      # of unfixed findings is printed so they stay visible for review.
      - name: Image vulnerability scans (gate 6)
        run: |
          mkdir -p scan-reports
          status=0
          for img in $(docker image ls --format '{{.Repository}}:{{.Tag}}' | grep '^gold-platform-m1-verify-'); do
            safe=$(printf '%s' "$img" | tr '/:' '__')
            trivy image --severity HIGH,CRITICAL --scanners vuln \
              --ignorefile .trivyignore.yaml --show-suppressed \
              --format json --output "scan-reports/${safe}.json" "$img"
            echo "::group::${img}"
            python3 -c "import json,sys; d=json.load(open(sys.argv[1])); n=sum(1 for r in (d.get('Results') or []) for v in (r.get('Vulnerabilities') or []) if not v.get('FixedVersion')); print(f'{n} finding(s) with no published fix - recorded in the evidence artifact, not gated')" "scan-reports/${safe}.json"
            trivy image --severity HIGH,CRITICAL --scanners vuln \
              --ignorefile .trivyignore.yaml --ignore-unfixed \
              --format table --exit-code 1 "$img" || status=1
            echo "::endgroup::"
          done
          exit "${status}"
      - name: SBOM per application image (gate 7)
        run: |
          mkdir -p sboms
          for img in $(docker image ls --format '{{.Repository}}:{{.Tag}}' | grep '^gold-platform-m1-verify-'); do
            safe=$(printf '%s' "$img" | tr '/:' '__')
            syft "$img" -o "spdx-json=sboms/${safe}.spdx.json"
          done
      - name: Record image digests + source commit (gate 8)
        run: |
          {
            echo "source_commit=${GITHUB_SHA}"
            docker image ls --digests --format '{{.Repository}}:{{.Tag}} {{.ID}} {{.Digest}}' | grep m1-verify || true
          } | tee image-manifest.txt
      - name: Remove ephemeral .env (always)
        if: always()
        run: rm -f .env
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: docker-evidence
          path: |
            image-manifest.txt
            trivy-deps.json
            scan-reports/
            sboms/
