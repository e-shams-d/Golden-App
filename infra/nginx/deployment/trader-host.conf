# The hostname traders reach this deployment on. One line, edited once per deployment.
#
# M12 slice 3.
#
# **Why a file rather than `${TRADER_HOST}`.** The official nginx image substitutes `${VAR}` only in
# `/etc/nginx/templates/*.template`, through an entrypoint that `infra/docker/nginx.Dockerfile`
# replaces with `ENTRYPOINT []` — and `read_only: true` means nothing could write the substituted
# result anyway. A `${TRADER_HOST}` in a server block is served to browsers as those nine
# characters. That was this slice's first draft, and `nginx -t` is what found it.
#
# **Why `deployment/` rather than `conf.d/`.** `infra/nginx/nginx.conf:31` includes
# `/etc/nginx/conf.d/*.conf` automatically, at `http` level, where `server_name` is a syntax error.
# Files here are included by name from inside the one block that should have them.
server_name trader.localhost;
