# The production server configuration: TLS, and two audiences on one certificate.
#
# M12 slice 3. Mounted over `default.conf` by `compose.prod.yml`; `local.conf` stays what a laptop
# runs. **The two are deliberately separate files rather than one file with `if` in it** — nginx's
# `if` inside a `server` block is the most misused directive in its language, and a production
# listener that behaves differently depending on an environment variable is one nobody can read.
#
# `test_production_stack.py` compares the two so the split cannot drift into a difference nobody
# chose: every `location` the local file serves must exist here, and the security headers must
# match.
#
# ## What is different from `local.conf`
#
# **TLS on 8443**, terminated here. The container listens on 8443 rather than 443 because it runs
# as an unprivileged user — `cap_drop: ALL` in the compose file means it cannot bind a low port, and
# publishing `443:8443` is what makes that work without giving the container `NET_BIND_SERVICE`.
#
# **No port-80 listener at all.** A plaintext listener exists to redirect the first request, and a
# redirect is interceptable by anyone on the path. With HSTS enabled a browser that has visited
# once will not try `http://` again; the first visit is the only exposure, and a connection refusal
# is a better first visit than a redirect somebody can rewrite.
#
# **`Strict-Transport-Security` is set here as well as by the applications.** The applications set
# it on their own responses; this sets it on everything nginx serves, including the health endpoint
# and any error page nginx generates itself before a proxy pass happens.
#
# ## What is deliberately the same
#
# Every proxy header, every `Cache-Control: no-store` on `/api/` and `/files/`, and every security
# header. A production configuration that quietly served weaker headers than the one it was tested
# against would be the most expensive kind of difference.

upstream trader_frontend {
    server trader-pwa:3000;
    keepalive 16;
}

upstream admin_frontend {
    server admin-web:3000;
    keepalive 16;
}

upstream backend_api {
    server backend:8000;
    keepalive 32;
}

map $http_x_request_id $request_id_safe {
    "~^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$" $http_x_request_id;
    default $request_id;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    "" "";
}

# TLS settings, shared by both server blocks below. TLS 1.2 is the floor rather than 1.3 only:
# 1.3-only would refuse clients this centre may actually have, and 1.2 with these ciphers is what
# the platform's own security document treats as acceptable.
ssl_certificate     /etc/nginx/tls/fullchain.pem;
ssl_certificate_key /etc/nginx/tls/privkey.pem;
ssl_protocols       TLSv1.2 TLSv1.3;
ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
ssl_prefer_server_ciphers off;
ssl_session_cache   shared:TLS:10m;
ssl_session_timeout 1h;
ssl_session_tickets off;

# The default server. Answers nothing: a request that names no host we serve gets a closed
# connection rather than whichever `server` block happened to be first.
server {
    listen 8443 ssl default_server;
    http2 on;
    server_name _;

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 444;
    }
}

server {
    listen 8443 ssl;
    http2 on;
    include /etc/nginx/deployment/trader-host.conf;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location ^~ /api/ {
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id_safe;
        proxy_set_header Connection "";
        add_header Cache-Control "no-store, private" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    location ^~ /files/ {
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id_safe;
        proxy_set_header Connection "";
        add_header Cache-Control "no-store, private" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    location / {
        proxy_pass http://trader_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id_safe;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}

server {
    listen 8443 ssl;
    http2 on;
    include /etc/nginx/deployment/admin-host.conf;

    # **OPS-004 lives in one file, and this is where it is applied.** The trader block above does
    # not include it: a rule applied to both would lock out every trader, which is the mistake the
    # separation is for.
    include /etc/nginx/deployment/admin-access.conf;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location ^~ /api/ {
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id_safe;
        proxy_set_header Connection "";
        add_header Cache-Control "no-store, private" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    location ^~ /files/ {
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id_safe;
        proxy_set_header Connection "";
        add_header Cache-Control "no-store, private" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    location / {
        proxy_pass http://admin_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id_safe;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
