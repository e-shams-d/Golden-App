# Who may reach the administrative panel. **This file is the whole of OPS-004's answer.**
#
# M12 slice 3. The owner deferred OPS-004 on 2026-09-14 — "open for now, decided before final
# delivery" — and the stack was built so that either answer is an edit here plus `nginx -s reload`,
# rather than a different deployment.
#
# **It is a separate file and not a block inside `production.conf` for one reason**: an access rule
# buried among forty lines of proxy configuration is one somebody edits by accident and nobody
# reviews on purpose. Here it is the only thing in the file, and a diff of this file is a diff of
# the decision.
#
# ## Today: everyone, and the consequence stated
#
# The panel where payments are approved is reachable from any address on the internet. The only
# thing between an attacker and a payment approval is a username and a password — there is no
# second layer. The platform's own controls still hold: rate limiting, lockout, dual control on the
# correction path, and an audit trail. None of them is a network boundary.
#
# **This is a recorded decision to defer, not an oversight**, and §20.5 keeps it visible: the M12
# exit gate requires open production-blocking ADRs to be resolved, so this file being in this state
# is what stops the milestone closing.
allow all;

# ## To restrict it — office and VPN only
#
# Replace the line above with the ranges that should reach it, ending in `deny all`. For example:
#
#     allow 10.8.0.0/24;      # the VPN's client range
#     allow 192.0.2.0/24;     # the office
#     deny all;
#
# Then `docker compose exec nginx nginx -s reload`. Nothing else changes: no image is rebuilt, no
# service restarts, and no session is lost.
#
# **Two things to check before believing it works**, because both have bitten deployments before:
#
# 1. `real_ip_header` must be set correctly if anything sits in front of nginx. Without it every
#    request appears to come from the proxy, `allow`/`deny` compares against the wrong address, and
#    the rule either admits everybody or nobody. `production.conf` sets no `real_ip` directives
#    today because nothing is in front of nginx in this deployment — adding a load balancer means
#    adding them in the same change.
# 2. The trader application must stay open. It is a different `server` block and does not include
#    this file; a rule applied to both would lock out every trader, which is the mistake this file's
#    narrowness is meant to prevent.
