# The hostname the administrative panel is reached on. One line, edited once per deployment.
#
# M12 slice 3. See `trader-host.conf` for why this is a file rather than an environment variable,
# and why it lives outside `conf.d/`.
#
# **A separate hostname from the trader application is not cosmetic.** `app/security/cookies.py:54`
# records that `SameSite` does not separate `admin.` from `trader.` on one site — the two audiences
# are distinguished by cookie name and by the server refusing the wrong one, not by the browser. A
# deployment that served both audiences on **one** hostname would remove even that separation, and
# `admin-access.conf` would then have no block of its own to restrict.
server_name admin.localhost;
