user nginx;
worker_processes auto;
pid /tmp/nginx.pid;

error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format structured escape=json
        '{"time":"$time_iso8601","remote_addr":"$remote_addr",'
        '"request_id":"$request_id_safe","host":"$host","method":"$request_method",'
        '"uri":"$uri","status":$status,"bytes":$body_bytes_sent,'
        '"request_time":$request_time,"upstream_time":"$upstream_response_time"}';
    access_log /dev/stdout structured;

    server_tokens off;
    sendfile on;
    keepalive_timeout 30s;
    client_body_timeout 30s;
    client_header_timeout 15s;

    # Local-development ceiling only. Production limits remain governed by POL-006.
    client_max_body_size 32m;

    include /etc/nginx/conf.d/*.conf;
}
