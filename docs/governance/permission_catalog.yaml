  configuration_and_governance:
    domain: configuration_governance
    source_refs:
      - "Implementation Docs/05_Backend_and_Security/12_Security_RBAC_Audit.md:840-858"
      - "Implementation Docs/05_Backend_and_Security/12_Security_RBAC_Audit.md:953-968"
      - "Implementation Docs/05_Backend_and_Security/12_Security_RBAC_Audit.md:2022-2036"
      - "Implementation Docs/05_Backend_and_Security/12_Security_RBAC_Audit.md:2040-2094"
    permissions:
      bank_profile.read:
        default_roles: [accountant, manager, business_admin, technical_admin, read_only_auditor]
        constraints: [authenticated_active, internal_business_scope]
      bank_profile.create_version:
        default_roles: [business_admin]
        conditional_roles:
          manager: approval_or_review_only
          technical_admin: technical_validation_only
        constraints: [authenticated_active, bank_configuration_change, state_guarded_command]
      # DOC-CONFLICT-045, added in M4 slice 9 together with the migration that seeds them.
      # Activation is "a critical audited command" (05_API_Specification.md:2125) and
      # document 08:347 restricts it to authorized configuration roles — and no permission
      # for it has ever existed. The command catalogue already records the consequence, as
      # `permission: []`.
      #
      # PROPOSED, AND GRANTED TO NOBODY. `default_roles` is empty, so every activation
      # request is denied under deny_by_default, including for business_admin. That is the
      # interim rule rather than an oversight: the route, its guards, its audit record and
      # its negative tests are all reviewable in that state, and approving the grant
      # changes nothing else.
      #
      # Borrowing `bank_profile.create_version` was the alternative and is worse than
      # blocking: it would make the role that drafts a configuration the role that puts it
      # into production, which is the split FINANCIAL_INTEGRITY_BASELINE.md §5 makes
      # non-configurable elsewhere — and this file already marks `manager` as
      # `approval_or_review_only` there, describing an approval authority with no
      # permission to exercise.
      #
      # The proposal is [manager, business_admin], and explicitly not technical_admin,
      # whose conditional role on both create permissions is technical_validation_only.
      bank_profile.activate_version:
        status: proposed_pending_owner_decision
        proposed_roles: [manager, business_admin]
        default_roles: []
        constraints: [authenticated_active, bank_configuration_change, state_guarded_command]
      bank_mapping.activate:
        status: proposed_pending_owner_decision
        proposed_roles: [manager, business_admin]
        default_roles: []
        constraints: [authenticated_active, bank_configuration_change, state_guarded_command]
      bank_mapping.create_version:
        default_roles: [technical_admin]
        conditional_roles:
          business_admin: read_or_business_review_only
          manager: approval_or_review_only
        constraints: [authenticated_active, bank_configuration_change, state_guarded_command]
      source_bank_account.manage:
        default_roles: [business_admin]
        conditional_roles:
          manager: approval_or_review_only
          technical_admin: technical_support_only
        constraints: [authenticated_active, bank_configuration_change, state_guarded_command]
      feature_flag.read:
        default_roles: [manager, business_admin, technical_admin, read_only_auditor]
        constraints: [authenticated_active, internal_business_scope]
      feature_flag.update:
        default_roles: [technical_admin]
        constraints: [authenticated_active, feature_flag_change, state_guarded_command]
      ai_configuration.read:
        phase: phase_1b_plus
        default_roles: [business_admin, technical_admin]
        constraints: [authenticated_active, phase_1b_disabled]
      ai_configuration.update:
        phase: phase_1b_plus
        default_roles: []
        assignment: approved_provider_configuration_role_after_ADR_SEC_014
        constraints: [authenticated_active, phase_1b_disabled, feature_flag_change]
      retention.read:
        default_roles: [manager, business_admin, read_only_auditor]
        conditional_roles:
          technical_admin: technical_input_only
        constraints: [authenticated_active, read_only_masked]
      retention.propose:
        default_roles: [business_admin]
        conditional_roles:
          technical_admin: technical_input_only
        constraints: [authenticated_active, retention_governance, state_guarded_command]
      retention.approve:
        default_roles: []
        assignment: appointed_business_or_legal_authority
        constraints: [authenticated_active, retention_governance, state_guarded_command]
      retention.activate:
        default_roles: []
        assignment: appointed_executor_after_approved_policy_and_dry_run
        constraints: [authenticated_active, retention_governance, state_guarded_command]
      legal_hold.read:
        default_roles: [manager, business_admin, read_only_auditor]
        constraints: [authenticated_active, read_only_masked]
      legal_hold.manage:
        default_roles: []
        assignment: appointed_legal_or_governance_authority
        constraints: [authenticated_active, legal_hold_governance, state_guarded_command]
      backup_status.read:
        default_roles: [technical_admin, read_only_auditor]
        constraints: [authenticated_active, read_only_masked]

