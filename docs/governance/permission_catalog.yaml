    description: canonical catalogue has correct_result and publication.correct but does not split preparer from second-person approver
    conservative_effect: no default role grant for either correction command
  - id: bank_configuration_activation_permissions
    description: catalogue names version creation but not separate activate/retire permissions for bank profiles and mappings
    conservative_effect: creation permission_does_not_imply_activation
