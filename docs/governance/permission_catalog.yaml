schema_version: "1.0"
catalog_id: gold_platform_phase_1a_permissions
status: approved_phase_1a
approval:
  date: "2026-08-01"
  approver: "Ehsan Shams — project owner"
  evidence: >-
    Owner approval in the M0 decision session, recorded on their instruction.
    Same convention as M0_READINESS.md; legal name and organizational role are
    not supplied.
  resolves: ["DOC-CONFLICT-013"]
  rationale: >-
    Document 12 identifiers win, and not only for consistency. They name the
    exact object a permission acts on: payment_batch_version.approve binds the
    manager's approval to the specific version that was reviewed, while
    document 05's payment_batch.approve names the mutable container and would
    let an approval outlive the content it approved. Document 05 spellings stay
    as deprecated aliases with explicit canonical_targets; an alias never
    broadens a grant and an ambiguous alias fails closed.
  scope: >-
    Approves the identifiers and the baseline role grants in this file for
    Phase 1A. It does not approve any command implementation, nor the open
    ADR-009 recent-auth factor, nor break-glass, which stays disabled.
phase_scope: phase_1a
language: en

authority:
  canonical_source:
    document: "Implementation Docs/05_Backend_and_Security/12_Security_RBAC_Audit.md"
    sections:
      - "8 Authorization Model"
      - "9 Separation of Duties"
      - "10 Permission Catalogue"
      - "11 Baseline RBAC Matrix"
      - "12 Command Authorization Contract"
  api_alias_source:
    document: "Implementation Docs/02_Architecture_and_Contracts/05_API_Specification.md"
    sections:
      - "8 Permission Naming"
      - "11 Admin Users and RBAC API"
      - "12 Traders and Trader Self-Service API"
  precedence_rule: >-
    Canonical permission identifiers and baseline grants come from document 12.
    Document 05 names are compatibility/migration aliases only. An alias never
    broadens a grant and ambiguous aliases fail closed pending M0 approval.

enforcement:
  default_effect: deny
  unknown_permission_effect: deny
  unknown_role_effect: deny
  unknown_alias_effect: deny
  role_name_alone_is_authorization: false
  frontend_permission_check_is_authorization: false
  backend_is_authoritative: true
  aliases_accepted_at_runtime: false
  permissions_must_be_explicitly_assigned: true
  object_scope_and_domain_guards_required: true
  command_check_order:
    - session_and_identity_domain
    - account_state_and_session_revocation
    - authoritative_role_and_permission_resolution
    - ownership_or_business_scope
    - recent_auth_and_dual_control
    - idempotency_and_request_hash
    - etag_or_immutable_version_hash
    - aggregate_locking
    - state_machine_and_domain_guards
    - business_change
    - atomic_audit_and_outbox
    - idempotency_completion
    - single_unit_of_work_commit
  source_refs:
    - "Implementation Docs/05_Backend_and_Security/12_Security_RBAC_Audit.md:119-136"
    - "Implementation Docs/05_Backend_and_Security/12_Security_RBAC_Audit.md:562-575"
    - "Implementation Docs/05_Backend_and_Security/12_Security_RBAC_Audit.md:623-630"
    - "Implementation Docs/05_Backend_and_Security/12_Security_RBAC_Audit.md:972-990"
    - "Implementation Docs/05_Backend_and_Security/12_Security_RBAC_Audit.md:2458-2465"

roles:
  trader_owner:
    identity_domain: trader
    baseline_purpose: own trader records, requests, publications, acknowledgements, and disputes
  accountant:
    identity_domain: internal
    baseline_purpose: operational review, batching, bank results, evidence, and confirmation
  manager:
    identity_domain: internal
    baseline_purpose: exact batch-version approval and configured high-risk decisions
  warehouse_operator:
    identity_domain: internal
    baseline_purpose: dispatch and receipt operations only
  business_admin:
    identity_domain: internal
    baseline_purpose: user/trader administration and approved business configuration
  technical_admin:
    identity_domain: internal
    baseline_purpose: technical configuration and operational support without implicit financial authority
  read_only_auditor:
    identity_domain: internal
    baseline_purpose: masked read-only records, reports, and audit
  support_operator:
    identity_domain: internal
    baseline_purpose: optional limited support workflow without financial mutation
    default_enabled: false
  system_worker:
    identity_domain: system
    baseline_purpose: technical asynchronous work without human financial authority

role_source_refs:
  - "Implementation Docs/05_Backend_and_Security/12_Security_RBAC_Audit.md:607-621"

constraint_profiles:
  authenticated_active:
    ownership: permission-specific scope is still required
    state: valid non-revoked session and allowed account state
    recent_auth: not_required_by_this_profile
    separation_of_duties: none
  own_actor_scope:
    ownership: derive trader or user identity from the authenticated actor; never trust a client-selected owner id
    state: referenced resource must remain in an allowed state
    recent_auth: not_required_by_default
    separation_of_duties: none
  internal_business_scope:
    ownership: require assigned or approved business scope and field-level shaping
    state: backend allowed-actions and domain guards apply
    recent_auth: not_required_by_default
    separation_of_duties: none
  read_only_masked:
    ownership: approved read scope only
    state: no state-changing side effect; sensitive fields are masked by policy
    recent_auth: not_required
    separation_of_duties: none
  state_guarded_command:
    ownership: own or internal scope according to the permission and actor domain
    state: explicit command endpoint, current allowed state, idempotency, and If-Match/hash when specified
    recent_auth: not_required_unless_an_overlay_profile_requires_it
    separation_of_duties: none_unless_an_overlay_profile_requires_it
  high_risk_role_grant:
    ownership: authorized identity-governance scope
    state: reason, before/after audit, authorization refresh or session invalidation
    recent_auth: required when granting high-risk financial authority
    separation_of_duties: recipient separation is policy-dependent and must fail closed when required
  batch_finalize:
    ownership: internal batch-preparation scope
    state: exact current draft version is valid and becomes immutable on success
    recent_auth: not_required_by_canonical_baseline
    separation_of_duties: finalizer identity is recorded and cannot approve the same version
  exact_batch_approval:
    ownership: manager approval scope
    state: exact current immutable ready_for_approval version, matching hash, row count, total, bank profile, mapping, and source account
    recent_auth: required and bound to actor, session, and action class
    separation_of_duties: approver must differ from creator/finalizer; approval never transfers to a replacement version
  approval_invalidation:
    ownership: configured manager or governance scope
    state: exact approved version and explicit invalidation/cancellation command
    recent_auth: required for configured cancellation or invalidation of an approved version
    separation_of_duties: no silent bypass; break-glass is a separately governed exception
  final_export_generation:
    ownership: authorized internal export scope
    state: exact approved immutable version and approval/hash/mapping/source-account match
    recent_auth: not_required_by_canonical_baseline
    separation_of_duties: upstream exact approval must already satisfy separation of duties
  exact_export_mark_sent:
    ownership: authorized internal export scope
    state: exact final available non-quarantined export; integrity and checksum revalidated; idempotent
    recent_auth: not_required_by_canonical_baseline
    separation_of_duties: human command required; download alone has no effect
  file_authorized_access:
    ownership: re-evaluate resource link, category, actor scope, and publication scope for every request
    state: normally only available and policy-clean files; signed access is short-lived
    recent_auth: not_required_by_default
    separation_of_duties: none
  sensitive_bundle_access:
    ownership: explicit internal grant; never trader scope
    state: lifecycle and scan policy permit access
    recent_auth: not_required_by_default
    separation_of_duties: technical support access is temporary and explicitly granted
  crop_creation:
    ownership: authorized source bundle/file/page scope
    state: source is available/clean; normalized bounds valid; provenance immutable; crop creates no financial result
    recent_auth: not_required
    separation_of_duties: worker cannot confirm evidence, payment, or publication
  candidate_only:
    ownership: authorized result-review scope
    state: suggestion only; no evidence or financial-state effect
    recent_auth: not_required
    separation_of_duties: human confirmation remains separate
  evidence_confirmation:
    ownership: authorized accountant result-review scope
    state: exact source and attempt; active-primary cardinality constraints; append-only replacement history
    recent_auth: not_required_by_default
    separation_of_duties: configured high-risk replacement review may require manager approval
  payment_result_confirmation:
    ownership: authorized accountant result scope
    state: exact sent attempt or approved exception; evidence policy; exact amount; no superseded/cancelled attempt; overpayment blocked
    recent_auth: not_required_by_default; text-only exception policy is unresolved
    separation_of_duties: AI and workers cannot execute; published-paid correction uses a separate higher-assurance profile
  publication_control:
    ownership: authorized internal publisher and exact trader/request scope
    state: immutable snapshot from confirmed results; privacy-approved evidence; full mixed bundle prohibited
    recent_auth: not_required_by_default
    separation_of_duties: correction of a published paid result uses published_paid_correction
  published_paid_correction:
    ownership: exact current result/publication scope
    state: append-only correction, aggregate recalculation, publication N+1, prior version superseded, trader notification
    recent_auth: conditional on the approved manager/dual-control policy; unresolved values fail closed
    separation_of_duties: second authorized human is the conservative default; exact permission/threshold remains ADR-SEC-009
  incoming_payment_control:
    ownership: authorized incoming-payment and gold-order scope
    state: exact receipt/statement/import-run context; partial/excess/ambiguity produces review, not silent success
    recent_auth: not_required_by_canonical_baseline
    separation_of_duties: manager exception/threshold is policy-dependent
  dispatch_control:
    ownership: warehouse dispatch scope for the exact order
    state: settlement and dispatch guards pass; explicit dispatch type and evidence policy
    recent_auth: not_required_by_canonical_baseline
    separation_of_duties: warehouse cannot override financial verification
  bank_configuration_change:
    ownership: approved business or technical configuration scope
    state: create immutable versions; used versions are not edited; activation is audited
    recent_auth: policy_pending_for_high_risk_activation
    separation_of_duties: business/technical approval split is risk-dependent and unresolved
  feature_flag_change:
    ownership: technical configuration scope
    state: flags never bypass authorization, audit, manager approval, or manual Phase 1A controls
    recent_auth: policy_pending_for_sensitive_enablement
    separation_of_duties: external AI, text-only confirmation, and sensitive download changes require separate approval
  retention_governance:
    ownership: appointed business/legal governance scope
    state: proposal, review, approval, legal-hold check, dry-run, backup coordination, activation, separate execution
    recent_auth: policy_pending_for_approval_and_activation
    separation_of_duties: technical_admin cannot unilaterally shorten retention and execute deletion
  legal_hold_governance:
    ownership: appointed legal/governance scope
    state: explicit scope, authority, effective time, release process, and audit; hold blocks deletion
    recent_auth: policy_pending
    separation_of_duties: release authority is unresolved and must be explicitly assigned
  break_glass_activation:
    ownership: incident-specific explicit scope
    state: disabled for Phase 1A by approved POL-005; no endpoint, grant, feature flag, runtime activation, or financial bypass; future enablement requires a new explicit decision
    recent_auth: required strong/recent authentication
    separation_of_duties: cannot silently bypass SoD; financial use requires immediate secondary review
  phase_1b_disabled:
    ownership: no Phase 1A operational grant
    state: feature disabled until provider/privacy/cost/evaluation ADRs are approved
    recent_auth: not_applicable
    separation_of_duties: no financial authority if enabled later

