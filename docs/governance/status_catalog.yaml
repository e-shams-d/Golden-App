schema_version: 1
catalog_status: approved_phase_1a
approval:
  date: "2026-08-01"
  approver: "Ehsan Shams — project owner"
  evidence: >-
    Owner approval in the M0 decision session, recorded on their instruction.
    Same convention as M0_READINESS.md; legal name and organizational role are
    not supplied.
  resolves: ["DOC-CONFLICT-001"]
  scope: >-
    Approves the canonical state names and the alias mappings in this file for
    Phase 1A. Document 06 wins every naming conflict with the PRD: the PRD
    spellings are recorded as legacy aliases and must never be implemented as
    API or database values. This approval does not freeze transition guards,
    which stay with document 06, nor any financial schema that consumes these
    states.
title: "Gold Trade Settlement Platform status catalog"
canonical_authority:
  document: "Implementation Docs/02_Architecture_and_Contracts/06_Workflows_and_State_Machines.md"
  version: "1.1"
  source:
    - "Implementation Docs/02_Architecture_and_Contracts/06_Workflows_and_State_Machines.md:5-10"
    - "Implementation Docs/02_Architecture_and_Contracts/06_Workflows_and_State_Machines.md:30-49"
  notes: "Document 06 is the approved M0 canonical authority for state names (owner approval 2026-08-01). Where the PRD spells a state differently, document 06 wins and the PRD spelling is a legacy alias."

flag_semantics:
  terminal:
    true: "No normal outgoing transition is defined for this state in document 06. Governed correction, replacement, or reopen may still exist when noted."
    false: "Document 06 defines or clearly implies a normal outgoing transition."
    null: "Document 06 does not establish terminality clearly enough for M0."
  derived:
    true: "Document 06 explicitly describes the state as an aggregate/usage summary derived from authoritative child records or conditions."
    false: "The state is entered by an explicit command or lifecycle transition and is not identified as derived."
    null: "The state mixes command side effects and recalculation, or document 06 does not classify it clearly."

catalog_notes:
  - "Aliases are compatibility observations, not approved API values."
  - "An unresolved alias has canonical: null and must not be implemented as an automatic mapping before M0 approval."
  - "Approved 2026-08-01 for Phase 1A. payment_request.sent_to_bank and payment_attempt.bank_result_pending are two different facts and stay separate: sent_to_bank is the request-level state while unresolved attempts exist, bank_result_pending is one attempt awaiting its bank result. Neither is an alias of the other."
  - "Approved 2026-08-08 for Phase 1A, resolving DOC-CONFLICT-037. The identity_account set below keeps its seven recorded aliases because seven is what documents 04 and 12 between them say; the schema permits four — active, suspended, recovery_required, deactivated — enforced by ck_admin_users_status and ck_trader_users_status. locked is refused because locked_until already carries it as a fact that expires on its own, so storing it twice permits an active row with a future lock and no constraint able to say which wins. pending is refused because the account is not pending approval, the business is, and that is traders.approval_status. inactive is refused in favour of deactivated because inactive is already a traders.operational_status value and reusing it across axes is the ambiguity DOC-CONFLICT-024 is about. Each refusal is recorded per value in tests/backend/test_status_catalogue_drift.py APPROVED_OMISSIONS, which requires the register row to be Resolved and to name the value."
  - "Terminal flags describe the normal document-06 workflow, not physical deletion or loss of audit history."
  - "Backend values remain English snake_case; localized labels are outside this catalog."

