    source:
      - "Implementation Docs/02_Architecture_and_Contracts/06_Workflows_and_State_Machines.md:555-607"
      - "Implementation Docs/01_Product_and_Domain/01_Product_Requirements_PRD.md:667-689"
      - "Implementation Docs/05_Backend_and_Security/10_Backend_Implementation_Guide.md:929-952"
    notes: >-
      Decided: the two values describe different facts and both stay, on
      different aggregates. payment_request.sent_to_bank is the request-level
      state while unresolved attempts exist; bank_result_pending belongs to
      PaymentAttempt only, where it means one attempt awaiting its bank result.
      payment_request.bank_result_pending is therefore a legacy value with no
      canonical meaning and must not appear in schema, API or UI. Collapsing
      them would lose the distinction between a whole request and a single
      bank transaction, which split and retry flows depend on.
