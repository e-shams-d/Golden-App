[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "golden-backend"
version = "0.1.0"
description = "Gold Trade Settlement Platform backend runtime"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }
dependencies = [
  "alembic==1.17.2",
  "argon2-cffi==25.1.0",
  "celery[redis]==5.5.3",
  "fastapi==0.139.0",
  # The bank file writer, and the only new production dependency M7 adds. G-1 in
  # `docs/handoff/M7_IMPLEMENTATION_PLAN.md`, approved by the project owner on 2026-08-22.
  #
  # **Chosen for what the deployment can do, not for features.** MIT licensed and pure Python —
  # `find .venv/lib -name '*.so'` finds nothing for it or for its one dependency `et-xmlfile` —
  # so there is no native build step, no compiler needed on the target, and the wheel can be
  # vendored for a network that cannot reach a registry. Two packages in total.
  #
  # **Verified against `15_Agent_Implementation_Plan.md` §15.6's requirements before it was
  # pinned**, rather than assumed: amounts round-trip as `int` (12,345,678,901,234 exactly, with
  # no float anywhere), Persian text survives, row order is preserved, and formula-like text can
  # be rendered inert. `tests/backend/test_excel_writer.py` re-asserts each of those against the
  # written file, so this comment is not the evidence.
  "openpyxl==3.1.5",
  # The crop renderer. Q-4 in `docs/handoff/M8_IMPLEMENTATION_PLAN.md`, decided 2026-08-24 on the
  # owner's instruction to take the simplest defensible answer.
  #
  # **Chosen for its licence first.** `pypdfium2` is Apache-2.0/BSD-3 and wraps Google's PDFium. The
  # more capable alternative is PyMuPDF, which is **AGPL-3.0 or paid** — choosing it would commit
  # this product to either a copyleft obligation or a purchase, and neither is a decision an
  # implementer should make quietly. The permissive option is the one that needs no sign-off; if the
  # owner later wants PyMuPDF's capability that is a licence purchase, and `receipt_segments`'
  # `renderer_version` is what makes the swap recordable rather than invisible.
  #
  # **Unlike `openpyxl`, both carry native code**, and the plan says so rather than glossing it. What
  # is preserved is the property that mattered: manylinux wheels ship the compiled library, so
  # nothing builds on the target and both can be vendored for a network that cannot reach a registry.
  # What is lost is the audit simplicity of a dependency with no native code at all.
  #
  # **Verified before being pinned, not after.** A page renders, rotation is applied, and re-rendering
  # the same rectangle at the same version and rotation is byte-identical — which is what
  # `SVC-CROP-004` needs and what makes §16.6's "approved tolerance" unnecessary (Q-3).
  # `tests/backend/test_crop_renderer.py` re-asserts each, so this comment is not the evidence.
  "pypdfium2==5.13.0",
  # Raster crop and rotation. HPND, and the only image library this project needs: PDFium produces a
  # bitmap, Pillow cuts the rectangle out of it and writes the PNG.
  "pillow==12.3.0",
  "pydantic==2.11.10",
  "pydantic-settings==2.10.1",
  "psycopg[binary]==3.2.12",
  # Required by `POST /api/v1/files`. `05_API_Specification.md:977` specifies
  # `multipart/form-data`, and Starlette raises at route registration without it — so it
  # is a dependency of the contract, not a convenience.
  #
  # **At least 0.0.30.** 0.0.20 was pinned first and the image scanner refused it with
  # three HIGH advisories: arbitrary file write via path traversal (fixed 0.0.22), and
  # two denial-of-service paths through multipart part headers and form-urlencoded
  # bodies (fixed 0.0.27 and 0.0.30). The first is the one that matters most here — it is
  # the exact risk surface of the endpoint this dependency exists for, and while
  # `generate_storage_key` never consults a client filename so our own path is not built
  # from input, the library writes its own temporary files and that is not our guard to
  # rely on.
  "python-multipart==0.0.32",
  "redis==5.2.1",
  "sqlalchemy==2.0.44",
  "uvicorn[standard]==0.35.0",
]

[dependency-groups]
dev = [
  "httpx==0.28.1",
  "mypy==1.18.2",
  "pytest==9.0.2",
  "pytest-cov==7.0.0",
  "ruff==0.14.3",
  # Stubs only, and deliberately in the dev group rather than beside `openpyxl` itself: they
  # are not imported at runtime and must not reach the deployed image. Without them mypy
  # reports `import-untyped` for every openpyxl import, and the alternative — an
  # `ignore_missing_imports` override — would silence real type errors in the one module that
  # writes the file a bank receives.
  "types-openpyxl==3.1.5.20250919",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.uv]
required-version = "==0.8.22"
# annotated-doc reaches the tree only through FastAPI. Hold it at the
# release that predates this upgrade so a same-day publish never enters
# the lock unreviewed; raise it deliberately when FastAPI needs more.
constraint-dependencies = ["annotated-doc==0.0.4"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["../../tests/backend", "../../tests/integration"]
# --strict-markers is on, so a marker must be registered before it is used or the
# whole run errors. Integration tests need a real PostgreSQL: they skip locally
# when INTEGRATION_ADMIN_DATABASE_URL is unset and fail in CI, because a silently
# skipped gate there is indistinguishable from a passing one.
markers = [
    "integration: requires a real PostgreSQL reached through INTEGRATION_ADMIN_DATABASE_URL",
]

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*.py" = ["UP007"]
# RUF001 flags Unicode characters that look like ASCII. These two files exist to
# handle exactly that: the hashing module maps Arabic forms to Persian ones so
# the same name hashes alike whichever keyboard produced it, and its tests assert
# that mapping. The characters are the subject, not a typo.
# Globbed rather than path-anchored: ruff resolves these against the config
# file's directory, and the linter is invoked from the repository root.
"**/hashing.py" = ["RUF001"]
"**/test_canonical_hashing.py" = ["RUF001"]
# Same reason, for the login-identifier normaliser: an Iranian keyboard
# produces Persian digits by default, so folding them is the module's
# purpose rather than a stray paste.
"**/identifiers.py" = ["RUF001"]
"**/test_identifiers.py" = ["RUF001"]
# M5 slice 2. The IBAN a trader actually types — Persian digits in the
# four-character grouping banks print — is the input under test, and the assertion
# is that it normalises to the same account as the ASCII spelling. Writing that
# constant in ASCII would delete the test while leaving it green.
"**/test_beneficiaries.py" = ["RUF001"]
# M7 slice 2. The bank file's column headers are Persian because the file is read by an
# Iranian bank, and the formula-introducer guard has to name the zero-width and
# bidirectional marks a payee name can legitimately contain — those characters are the
# subject of the code, not a stray paste. `15_Agent_Implementation_Plan.md:972-974`
# requires Persian and English text to round-trip, which is asserted against the written
# file rather than against these constants.
"**/exports/excel.py" = ["RUF001"]
"**/test_excel_writer.py" = ["RUF001"]
# M10 slice 4, and the same argument read the other way round: `excel.py` writes a file an Iranian
# bank reads, and these two read a file an Iranian bank wrote. The Persian digits are the input
# under test — one row of the fixture statement is written in them precisely so the fold to ASCII
# is asserted against a real workbook, and so the raw copy can be asserted to have survived it.
# Writing that row in ASCII would delete the test while leaving it green, which is the failure the
# M5 entry above records. The parser's own fold table names both digit ranges for the same reason.
"**/statements/parser.py" = ["RUF001"]
"**/test_bank_statement_rows.py" = ["RUF001"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/versions/"]

[[tool.mypy.overrides]]
module = ["celery.*", "kombu.*"]
ignore_missing_imports = true

# M8 slice 4. `pypdfium2` publishes no `py.typed` marker and no stub package exists, so unlike
# `openpyxl` — where `types-openpyxl` let the override be refused — there is nothing to prefer over
# this. The loss is real and is contained deliberately: `app/exports/crop.py` is the only module in
# the tree that imports it, and `_raster` annotates the one value that crosses back into typed code
# so the `Any` cannot spread to callers. Everything the library is trusted for — reproducible bytes,
# rotation, page count, page size — is asserted against real output in
# `tests/backend/test_crop_renderer.py`, which is where a type checker was never going to help.
[[tool.mypy.overrides]]
module = ["pypdfium2.*"]
ignore_missing_imports = true
