[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
path_separator = os
sqlalchemy.url =

# Revision identifiers are date-ordered and reviewable, never random hex. Create a
# revision with an explicit id in the form YYYYMMDD_NNNN, where NNNN restarts at 0001
# each day and increments for a second revision on the same day:
#
#     alembic revision --rev-id 20260802_0001 -m "add audit logs"
#
# The filename then follows the id, so `ls alembic/versions` reads in apply order.
# A migration created without --rev-id must be renamed before review; a random hex id
# hides ordering from anyone reading the directory.
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
