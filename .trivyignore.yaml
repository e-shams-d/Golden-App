# Reviewed vulnerability exceptions. Every entry needs a reason and an expiry
# so it comes back for review instead of becoming permanent. Remove an entry as
# soon as a fixed release reaches the dependency tree.
#
# Empty, and that is the intended state.
#
# CVE-2026-14257 (brace-expansion) was carried here because the 1.x line had no
# fixed release at all: the fix existed only four majors up, in an API minimatch
# 3 cannot use. The entry said so, and said to revisit when a 1.x fix appeared.
# 1.1.18 now exists, so both major lines are pinned to fixed releases in
# pnpm-workspace.yaml and the exception is removed rather than extended. An
# exception whose stated reason has expired is worse than none, because it still
# reads as reviewed.
#
# CVE-2026-69152 was never added. It explicitly bypasses the CVE-2026-14257
# mitigation, so the earlier fix stopped being sufficient and 5.0.8 became
# affected again — an exception written against the superseded advisory would
# have covered nothing while appearing to cover it.
vulnerabilities: []
