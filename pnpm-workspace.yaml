packages:
  - "apps/*"
  - "packages/*"

# Node 24 LTS is the M1 runtime baseline. Do not silently install under an EOL
# runtime and produce artifacts that CI/production cannot reproduce.
engineStrict: true

# Exact versions are intentional until the first reviewed lockfile is generated
# in a Node 24 environment. Internal packages use workspace:* separately.
catalog:
  "@axe-core/playwright": "4.12.1"
  "@eslint/js": "9.39.5"
  "@playwright/test": "1.61.1"
  "@tailwindcss/postcss": "4.3.3"
  "@tanstack/react-query": "5.101.2"
  "@types/node": "24.13.3"
  "@types/react": "19.2.17"
  # **Raised from 19.1.9 with the Next.js upgrade on 2026-09-10, and it had to be.** Next 16.3.3's
  # own declarations reference `react-dom`'s partial-prerender surface — `PostponedState`,
  # `resume`, `PrerenderOptions.onHeaders` — which 19.1.9 does not declare, so `tsc` failed inside
  # `node_modules/next` before it reached a line of this project's code. 19.2.7 is the highest
  # 19.2 release and matches the pinned `react-dom` runtime exactly, which is the version this
  # entry should have tracked all along: the types were a minor behind the runtime they describe.
  "@types/react-dom": "19.2.7"
  "eslint": "9.39.5"
  # Raised together on 2026-09-10 for the two CRITICALs in the overrides note below.
  # `eslint-config-next` tracks the framework version by design; leaving it a minor behind is how
  # the lint rules and the framework come to disagree about what an app may do.
  "eslint-config-next": "16.3.3"
  "next": "16.3.3"
  "postcss": "8.5.18"
  "react": "19.2.7"
  "react-dom": "19.2.7"
  "react-hook-form": "7.82.0"
  "tailwindcss": "4.3.3"
  "turbo": "2.10.0"
  "typescript": "6.0.3"
  "typescript-eslint": "8.64.0"
  "vitest": "4.1.10"
  "zod": "4.4.3"

allowBuilds:
  # Both packages are transitive native dependencies of the pinned Next.js /
  # ESLint toolchain. Their lifecycle scripts only prepare the platform binary
  # already selected by the lockfile; all other dependency scripts stay denied.
  sharp: true
  unrs-resolver: true

# Security overrides lift transitive packages to their lowest fixed release.
# Next.js ships postcss 8.4.31 (GHSA-r28c-9q8g-f849 path traversal) and
# sharp 0.34.5 (GHSA-f88m-g3jw-g9cj libvips issues). sharp is held at 0.35.1
# rather than the 0.35.0 the advisory names, because 0.35.0 ships type
# declarations that TypeScript cannot resolve through its package exports and
# breaks the Next.js image-optimizer types. Re-check these whenever Next.js is
# upgraded, and drop an entry once upstream ships the fix.
#
# brace-expansion is pinned on both major lines it appears on. CVE-2026-69152
# explicitly bypasses the CVE-2026-14257 mitigation, so the earlier fix is not
# sufficient and 5.0.8 is affected again. The 1.x copy reaches the tree through
# minimatch 3, which only ESLint depends on; it previously had no fixed release
# at all, which is why it was carried as a documented exception. 1.1.18 now
# exists, so the exception is removed rather than extended — an exception whose
# stated reason has expired is worse than none, because it reads as reviewed.
# js-yaml is pinned to 4.3.1 for CVE-2026-59870 (GHSA-5p4m-2wfm-xmqj), quadratic
# CPU consumption resolving `!!omap`. It reaches the tree only through
# `@eslint/eslintrc`, so nothing this project ships parses untrusted YAML with it —
# but a fixed release exists, and this repository pins rather than files an
# exception whenever one does. The advisory also names 3.15.1 for the 3.x line;
# that line is not in the tree, and pinning a version nothing installs would read
# as coverage while providing none.
# nanoid is pinned for CVE-2026-67213 (infinite loop in `customAlphabet`). It reaches
# the tree through postcss, which Next.js pulls in, so only the 3.x line is installed —
# the advisory also names 5.1.6, and pinning a line nothing installs would read as
# coverage while providing none. Same reasoning that kept the js-yaml 3.x line out.
#
# Raised from 3.3.17 to 3.3.18: the earlier entry named 3.3.17 as the fix for this same
# CVE, and the advisory now lists 3.3.17 as affected. So the override was doing its job
# — holding the tree at a floor — while the floor itself was vulnerable, and the scan
# kept passing because the pin looked deliberate. An override is only as current as the
# advisory it was read from, which is the argument for re-reading them on every finding
# rather than trusting the comment beside them.
#
# browserslist is pinned to 4.28.7 for CVE-2026-73088 (GHSA-73wf-gq98-2v4g, prototype write
# from an untrusted query) and CVE-2026-73089 (GHSA-c83g-rgw3-j3cx, unbounded memory growth
# because the query cache never evicts). Both advisories name `<= 4.28.6` affected and 4.28.7
# first patched. It reaches the tree only through `@babel/helper-compilation-targets`, which
# Next.js pulls in, so nothing here feeds it a query from a request — but a fixed release
# exists, and this repository pins rather than files an exception whenever one does.
#
# 4.28.8 is the current latest and is not what this pins to. The policy above is the lowest
# fixed release, and the nanoid entry is the reason: a floor chosen for any reason other than
# "this is where the advisory says the fix landed" stops being checkable against the advisory.
# Both 4.28.7 and 4.28.8 were read from the GitHub advisory database on 2026-09-02, and no
# advisory lists either as affected.
#
# --- 2026-09-10: three floors raised, and two of them are the recurring lesson again ---
#
# **js-yaml 4.3.1 -> 4.3.2**, for CVE-2026-84375, a denial of service in YAML parsing. 4.3.1 was
# this file's own floor, chosen for CVE-2026-59870 — and it is now itself affected. The nanoid
# entry above records the identical shape: an override holds the tree at a floor while the floor
# becomes vulnerable underneath it, and the scan keeps passing because the pin looks deliberate.
# That is the argument for re-reading every advisory on every finding rather than trusting the
# comment beside the pin, and it has now happened twice.
#
# **sharp 0.35.1 -> 0.35.4**, for GHSA-rgj7-g3m4-5g8c, which is libheif's GHSA-g89c-p67h-r497 and
# GHSA-2jg2-4ch7-h545 reaching the tree through sharp's bundled libvips. This project *does* feed
# sharp untrusted bytes — it renders previews and crops of bank documents people upload — so
# unlike js-yaml and browserslist above, the exposure here is real rather than theoretical. The
# note at the top of this block says to re-check sharp whenever Next.js is upgraded, and the entry
# below does exactly that in the same commit.
#
# **next 16.2.11 -> 16.3.3** is a *catalog* change rather than an override, because Next.js is a
# direct dependency this project chose. Two CRITICALs: CVE-2026-75604, unauthenticated remote code
# execution on Windows-hosted servers, and GHSA-2xp9-vwfh-vxw4, unauthenticated remote code
# execution in the image optimization API when handling AVIF files. The first does not describe
# this deployment — ADR-002 puts one Linux server behind nginx — and **the second does**: the image
# optimizer is reachable and the bytes it optimizes are uploaded documents. The advisory names
# 15.5.24 and 16.3.3 as first patched; 16.3.3 is the one on this major line.
overrides:
  "postcss@<8.5.18": "8.5.18"
  "nanoid@<3.3.18": "3.3.18"
  "sharp@<0.35.4": "0.35.4"
  "brace-expansion@^5.0.0": "5.0.9"
  "brace-expansion@^1.0.0": "1.1.18"
  "js-yaml@<4.3.2": "4.3.2"
  "browserslist@<4.28.7": "4.28.7"
